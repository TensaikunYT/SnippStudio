<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>r1 Nisan 1986</title>
<style>
html,body{margin:0;width:1920px;height:1080px;background:transparent;overflow:hidden;font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif}
#s{position:absolute;inset:0}
.it{position:absolute;opacity:0;will-change:transform,opacity}
#line{left:96px;top:700px;width:560px;height:6px;background:#ffb703;border-radius:3px;transform-origin:left;box-shadow:0 2px 12px rgba(0,0,0,.45)}
#mo{left:96px;top:610px;font-size:64px;font-weight:800;letter-spacing:.35em;color:#fff;text-shadow:0 3px 14px rgba(0,0,0,.6)}
#yr{left:90px;top:716px;font-size:210px;font-weight:900;line-height:1;color:#ffb703;font-variant-numeric:tabular-nums;text-shadow:0 6px 24px rgba(0,0,0,.55)}
#loc{left:96px;top:960px;padding:16px 30px;font-size:44px;font-weight:700;color:#fff;background:rgba(20,24,34,.82);border-left:8px solid #ffb703;border-radius:6px}
#loc small{display:block;font-size:26px;font-weight:600;color:#ffd166;letter-spacing:.2em;margin-bottom:2px}
</style></head><body>
<div id="s">
 <div class="it" id="line"></div>
 <div class="it" id="mo">NİSAN</div>
 <div class="it" id="yr">1986</div>
 <div class="it" id="loc"><small>SOVYET UKRAYNASI</small>Yepyeni bir şehir</div>
</div>
<script>
// t = seconds from the start of this range (range starts at 0 s of the talk).
const C=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),P=(t,a,b)=>C((t-a)/(b-a)),E=x=>1-Math.pow(1-x,3),
 K=x=>{const c=2.70158;return 1+c*Math.pow(x-1,3)+1.70158*Math.pow(x-1,2)};
const $=id=>document.getElementById(id),DUR=5.8,OUT=P;
function place(el,t,a,dx,dy,o){ // enter at a over .5s, leave at o over .35s
  const i=E(P(t,a,a+.5)),f=1-P(t,o,o+.35);
  el.style.opacity=i*f;el.style.transform=`translate(${(1-i)*dx}px,${(1-i)*dy}px)`;
}
function renderOut(t){
  const f=1-P(t,5.4,5.8);
  const l=$('line');l.style.opacity=f;l.style.transform=`scaleX(${E(P(t,0,.6))})`;
  place($('mo'),t,0,-60,0,5.4);
  const y=$('yr');const p=E(P(t,.1,1.4));
  y.textContent=Math.round(1976+10*p);y.style.opacity=P(t,.1,.4)*f;
  y.style.transform=`translateY(${(1-K(P(t,.1,.8)))*60}px) scale(${1+(1-p)*.04})`;
  const lo=$('loc');lo.style.opacity=E(P(t,2.54,3))*f;
  lo.style.transform=`translateX(${(1-E(P(t,2.54,3.1)))*-80}px)`;
  // word "yepyeni bir şehirde" (3.76-5.04): underline emphasis
  lo.style.boxShadow=`inset 0 -${Math.round(6*P(t,3.76,5.04))}px 0 #ffb703`;
}
let driven=false;window.renderOut=t=>{driven=true;renderOut(t)};window.READY=true;
const s0=performance.now();(function L(){if(!driven)renderOut(((performance.now()-s0)/1000)%DUR);requestAnimationFrame(L)})();
</script></body></html>
