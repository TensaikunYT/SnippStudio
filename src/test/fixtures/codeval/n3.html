<!doctype html><meta charset="utf-8"><style>html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:transparent}*{box-sizing:border-box}body{font-family:Segoe UI,Arial,sans-serif;color:#fff}.a{position:absolute}.card{background:rgba(15,20,30,.82);border:2px solid rgba(255,255,255,.25);border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.4)}</style>
<div class="a card" style="left:120px;top:90px;padding:28px 44px;width:560px;text-align:center"><div style="font-size:28px;color:#ccc">ACİL KAPATMA (AZ-5)</div><div id=n style="font-size:130px;font-weight:800;line-height:1.1">40</div><div style="font-size:28px;margin-top:-6px">saniye</div><div style="height:14px;background:#333;border-radius:7px;margin-top:18px;overflow:hidden"><div id=b style="height:100%;background:#e5484d;width:0"></div></div><div id=btn style="margin:22px auto 0;width:110px;height:110px;border-radius:50%;background:#e5484d;border:8px solid #7a1d20;font-size:28px;line-height:94px;font-weight:800">AZ-5</div></div>
<script>
var DUR=5.2,q=function(i){return document.getElementById(i)},E=function(x){return Math.max(0,Math.min(1,x))},S=function(t,a,b){return 1-Math.pow(1-E((t-a)/(b-a)),3)};
function draw(t){var p=E((t-.6)/3.2),o=1-S(t,4.7,5.2);document.body.style.opacity=S(t,0,.4)*o;q('n').textContent=Math.max(0,Math.round(40*(1-p)));q('b').style.width=(100*p)+'%';var pr=S(t,3.8,4.1);q('btn').style.transform='scale('+(1-.2*pr)+')';q('btn').style.boxShadow=pr>0?'0 0 '+(40*pr)+'px #e5484d':'none'}
var ext=false;window.renderOut=function(t){ext=true;draw(t)};window.READY=true;var t0=performance.now();(function L(){if(!ext)draw(((performance.now()-t0)/1000)%DUR);requestAnimationFrame(L)})();
</script>
