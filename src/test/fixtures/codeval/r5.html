<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>r5 30 km yasak bölge</title>
<style>
html,body{margin:0;width:1920px;height:1080px;background:transparent;overflow:hidden;font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif}
#m{position:absolute;left:1260px;top:60px;width:560px;height:560px;opacity:0}
#t{position:absolute;left:1260px;top:640px;width:560px;text-align:center;font-size:52px;font-weight:900;color:#fff;letter-spacing:.08em;opacity:0;text-shadow:0 4px 16px rgba(0,0,0,.65)}
#t b{color:#ff3b30}
</style></head><body>
<svg id="m" viewBox="0 0 560 560">
 <defs><pattern id="h" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="rgba(255,59,48,.14)"/><rect width="7" height="18" fill="rgba(255,59,48,.45)"/></pattern>
 <clipPath id="cc"><circle id="cr" cx="280" cy="280" r="0"/></clipPath></defs>
 <circle cx="280" cy="280" r="270" fill="rgba(18,22,32,.78)"/>
 <g stroke="rgba(255,255,255,.12)" stroke-width="2"><path d="M280 20V540M20 280H540"/></g>
 <rect x="10" y="10" width="540" height="540" fill="url(#h)" clip-path="url(#cc)"/>
 <circle id="ring" cx="280" cy="280" r="250" fill="none" stroke="#ff3b30" stroke-width="8" stroke-dasharray="1571" stroke-dashoffset="1571" transform="rotate(-90 280 280)"/>
 <line id="rad" x1="280" y1="280" x2="280" y2="280" stroke="#fff" stroke-width="4" stroke-dasharray="10 8"/>
 <circle cx="280" cy="280" r="10" fill="#ffb703"/><circle id="pul" cx="280" cy="280" r="10" fill="none" stroke="#ffb703" stroke-width="4"/>
 <text id="km" x="410" y="262" fill="#fff" font-size="46" font-weight="900" text-anchor="middle" opacity="0" font-family="Segoe UI,Arial,sans-serif" paint-order="stroke" stroke="#12161f" stroke-width="8">30 km</text>
</svg>
<div id="t"><b>YASAK</b> BÖLGE</div>
<script>
// t = seconds from the start of this range (range starts at 536.487 s of the talk, first word "Santralin").
const C=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),P=(t,a,b)=>C((t-a)/(b-a)),E=x=>1-Math.pow(1-x,3),
 K=x=>{const c=2.70158;return 1+c*Math.pow(x-1,3)+1.70158*Math.pow(x-1,2)};
const $=id=>document.getElementById(id),DUR=4.5;
function renderOut(t){
  const f=1-P(t,4.1,4.5);
  $('m').style.opacity=E(P(t,0,.4))*f;$('m').style.transform=`scale(${.9+.1*E(P(t,0,.6))})`;
  // pulse from the plant ("Santralin çevresinde" 0–1.26)
  const q=(t%1.2)/1.2;$('pul').setAttribute('r',10+60*q);$('pul').setAttribute('opacity',(1-q)*P(t,.1,.4));
  // "30 kilometrelik" (1.26–2.52): radius line draws, ring sweeps round
  const rp=E(P(t,1.2,2.0));$('rad').setAttribute('x2',280+250*rp*Math.cos(-.5));$('rad').setAttribute('y2',280+250*rp*Math.sin(-.5));
  $('ring').setAttribute('stroke-dashoffset',1571*(1-E(P(t,1.4,2.8))));
  $('km').setAttribute('opacity',E(P(t,1.7,2.1)));
  // "yasak bölge" (2.66–3.38): hatched zone floods in, label slams
  $('cr').setAttribute('r',255*E(P(t,2.66,3.3)));
  const a=$('t'),s=K(P(t,2.66,3.2));a.style.opacity=P(t,2.66,2.8)*f;a.style.transform=`scale(${.6+.4*s})`;
}
let driven=false;window.renderOut=t=>{driven=true;renderOut(t)};window.READY=true;
const s0=performance.now();(function L(){if(!driven)renderOut(((performance.now()-s0)/1000)%DUR);requestAnimationFrame(L)})();
</script></body></html>
