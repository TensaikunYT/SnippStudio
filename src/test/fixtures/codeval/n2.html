<!doctype html><meta charset="utf-8"><style>html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:transparent}*{box-sizing:border-box}body{font-family:Segoe UI,Arial,sans-serif;color:#fff}.a{position:absolute}.card{background:rgba(15,20,30,.82);border:2px solid rgba(255,255,255,.25);border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.4)}</style>
<div class="a card" style="left:120px;top:90px;padding:28px 40px;width:760px"><div style="font-size:30px;margin-bottom:18px">Reaktörler</div><div id=r style="display:flex;gap:18px"></div><div id=k style="font-size:28px;margin-top:16px;display:flex;justify-content:space-between"><span style="color:#5fd38d">● 4 çalışıyor</span><span style="color:#f5b942">◌ 2 inşa halinde</span></div></div>
<script>
var DUR=3.6,E=function(x){return Math.max(0,Math.min(1,x))},S=function(t,a,b){return 1-Math.pow(1-E((t-a)/(b-a)),3)};
var R=document.getElementById('r'),B=[];for(var i=0;i<6;i++){var d=document.createElement('div');d.style.cssText='flex:1;height:130px;border-radius:12px 12px 4px 4px;display:flex;align-items:flex-end;justify-content:center;font-size:36px;font-weight:700;padding-bottom:8px';d.textContent=i+1;R.appendChild(d);B.push(d)}
function draw(t){var o=1-S(t,3.2,3.6);document.body.style.opacity=o;for(var i=0;i<6;i++){var s=S(t,.2+i*.25,.6+i*.25),d=B[i];d.style.opacity=s;d.style.transform='translateY('+(30*(1-s))+'px)';if(i<4){d.style.background='#2e9e63';d.style.boxShadow='0 0 '+(10+8*Math.sin(t*5+i))+'px #5fd38d'}else{d.style.background='repeating-linear-gradient(45deg,#c58a1c,#c58a1c 12px,#8a5f10 12px,#8a5f10 24px)'}}document.getElementById('k').style.opacity=S(t,1.7,2.3)}
var ext=false;window.renderOut=function(t){ext=true;draw(t)};window.READY=true;var t0=performance.now();(function L(){if(!ext)draw(((performance.now()-t0)/1000)%DUR);requestAnimationFrame(L)})();
</script>
