<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>r3 40 saniye AZ-5</title>
<style>
html,body{margin:0;width:1920px;height:1080px;background:transparent;overflow:hidden;font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif}
.it{position:absolute;opacity:0}
#clock{left:96px;top:640px;width:380px;height:380px}
#num{position:absolute;left:0;top:92px;width:380px;text-align:center;font-size:150px;font-weight:900;color:#fff;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 4px 18px rgba(0,0,0,.6)}
#sn{position:absolute;left:0;top:250px;width:380px;text-align:center;font-size:40px;font-weight:700;letter-spacing:.3em;color:#ffd166;text-shadow:0 3px 10px rgba(0,0,0,.6)}
#btn{left:560px;top:700px;width:260px;height:300px}
#az{left:880px;top:770px;font-size:190px;font-weight:900;color:#ff3b30;letter-spacing:.04em;text-shadow:0 0 0 #000,0 8px 30px rgba(0,0,0,.6);-webkit-text-stroke:6px #fff;paint-order:stroke fill;transform-origin:left center}
#cap{left:560px;top:1012px;font-size:36px;font-weight:700;color:#fff;background:rgba(20,24,34,.82);padding:8px 22px;border-radius:6px;border-left:8px solid #ff3b30;white-space:nowrap}
</style></head><body>
<div class="it" id="clock">
 <svg width="380" height="380" viewBox="0 0 380 380"><circle cx="190" cy="190" r="170" fill="rgba(18,22,32,.82)"/><circle cx="190" cy="190" r="170" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="16"/>
 <circle id="arc" cx="190" cy="190" r="170" fill="none" stroke="#ffb703" stroke-width="16" stroke-linecap="round" transform="rotate(-90 190 190)" stroke-dasharray="1068" stroke-dashoffset="0"/></svg>
 <div id="num">40</div><div id="sn">SANİYE</div>
</div>
<div class="it" id="btn">
 <svg width="260" height="300" viewBox="0 0 260 300">
  <rect x="10" y="190" width="240" height="100" rx="14" fill="#2b2f3a" stroke="#fff" stroke-width="5"/>
  <rect x="30" y="170" width="200" height="40" rx="8" fill="#555c6b"/>
  <g id="cap2"><rect x="60" y="60" width="140" height="110" rx="55" fill="#ff3b30" stroke="#fff" stroke-width="6"/><ellipse cx="130" cy="82" rx="42" ry="12" fill="#ff8a80" opacity=".7"/></g>
 </svg>
</div>
<div class="it" id="cap">acil kapatma düğmesi</div>
<div class="it" id="az">AZ-5</div>
<script>
// t = seconds from the start of this range (range starts at 167.858 s of the talk, first word "Daha").
const C=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),P=(t,a,b)=>C((t-a)/(b-a)),E=x=>1-Math.pow(1-x,3),
 K=x=>{const c=2.70158;return 1+c*Math.pow(x-1,3)+1.70158*Math.pow(x-1,2)};
const $=id=>document.getElementById(id),DUR=5.24;
function renderOut(t){
  const f=1-P(t,4.9,5.24);
  const ck=$('clock');ck.style.opacity=E(P(t,.1,.5))*f;ck.style.transform=`scale(${.8+.2*K(P(t,.1,.7))})`;
  // "40 saniye geçmeden" (.22 → 1.46) then keeps running until the button is hit (3.62)
  const p=P(t,.22,3.5);
  $('num').textContent=Math.max(0,Math.ceil(40*(1-p)));
  $('arc').setAttribute('stroke-dashoffset',1068*p);
  $('arc').setAttribute('stroke',p>.8?'#ff3b30':'#ffb703');
  // "acil kapatma düğmesine" (1.46–3.1): button rises in, "basılıyor" 3.1–3.62: pressed
  const b=$('btn');b.style.opacity=E(P(t,1.46,1.9))*f;b.style.transform=`translateY(${(1-K(P(t,1.46,2.1)))*60}px)`;
  const press=P(t,3.1,3.3)*(1-.7*P(t,3.5,3.9));
  $('cap2').setAttribute('transform',`translate(0,${40*press})`);
  $('cap').style.opacity=E(P(t,2.2,2.7))*f;
  // "AZ-5" 4.12: stamp slam with shake
  const a=$('az'),q=P(t,4.12,4.4),sh=t>4.12&&t<4.6?Math.sin(t*90)*8*(1-P(t,4.12,4.6)):0;
  a.style.opacity=(q>0?1:0)*f;a.style.transform=`translate(${sh}px,${sh*.6}px) scale(${q>0?1+(1-E(q))*1.6:1})`;
}
let driven=false;window.renderOut=t=>{driven=true;renderOut(t)};window.READY=true;
const s0=performance.now();(function L(){if(!driven)renderOut(((performance.now()-s0)/1000)%DUR);requestAnimationFrame(L)})();
</script></body></html>
